services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler -d scheduler']
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler
      DB_POOL_MAX: 20
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: service-scheduler
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Migrations and the (idempotent) seed run before the API starts, so `docker compose up` is enough.
    command: >
      sh -c "node dist/scripts/db-migrate.js &&
             node dist/scripts/db-seed.js &&
             node --require ./dist/src/tracing.js dist/src/main.js"
    ports:
      - '3000:3000'
